    <text class="text med" x="0" y="163"><tspan class="n1">Tools:</tspan> Docker, Nix, Git</text>
    <text class="text med" x="0" y="190"><tspan class="n1">WM:</tspan> niri</text>
    <text class="text med" x="0" y="217"><tspan class="n1">Editor:</tspan> Neovim</text>
    <text class="text med" x="0" y="244"><tspan class="n1">Learning:</tspan> Reverse Engineering</text>
    <text class="text med" x="73" y="267">Low-Level Programming</text>
  </g>
</g>


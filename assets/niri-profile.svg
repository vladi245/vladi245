<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Niri-style snapping GitHub profile</title>
<desc id="desc">A NixOS-inspired profile that snaps between terminal windows to the right like niri's horizontal scrollable tiling layout.</desc>

<style>
:root{
  --desktop:#090d12;--bg:#0d1117;--panel:#10161d;--fg:#e6edf3;--muted:#8b949e;
  --border:#30363d;--nix1:#7ebae4;--nix2:#5277c3;--green:#7ee787
}
.desktop{fill:var(--desktop)}
.window{fill:var(--bg);stroke:var(--border);stroke-width:1.5}
.focus{fill:none;stroke:var(--nix2);stroke-width:1.4}
.text{font-family:"DejaVu Sans Mono","Liberation Mono",Consolas,monospace;fill:var(--fg)}
.muted{fill:var(--muted)}.n1{fill:var(--nix1)}.n2{fill:var(--nix2)}.green{fill:var(--green)}
.small{font-size:12px}.med{font-size:14px}.big{font-size:17px}.titletext{font-size:20px;font-weight:700}
.dot{fill:#484f58}
.status{animation:statusPulse 1.8s ease-in-out infinite}
.cursor{animation:blink 1s steps(2,start) infinite}
.rule{stroke:var(--border);stroke-width:1}
.card{fill:var(--panel);stroke:var(--border);stroke-width:1}
.node{fill:var(--bg);stroke:var(--nix1);stroke-width:2}.nodecore{fill:var(--nix1)}
.hash{font-size:11px;fill:var(--nix2)}.projectName{font-size:15px;font-weight:700}.projectDesc{font-size:12px;fill:var(--muted)}
.globe{fill:none;stroke:var(--nix2);stroke-width:1.3}.globe2{fill:none;stroke:var(--nix1);stroke-width:1.1;opacity:.8}
.float{animation:float 4s ease-in-out infinite}.meridian{transform-origin:300px 310px}
.m1{animation:mer1 5s ease-in-out infinite}.m2{animation:mer2 5s ease-in-out infinite reverse}
.marker{fill:var(--nix1);filter:drop-shadow(0 0 4px rgba(126,186,228,.5))}
.link{stroke:var(--nix2);stroke-width:1.4;fill:none}
.shadow{filter:drop-shadow(0 14px 22px rgba(0,0,0,.35))}
.hint{opacity:.68}
.track{
  will-change:transform;
  animation:niriSnap 20s infinite;
}

/*
  Niri-like behavior:
  - long hold on the focused column
  - very quick eased viewport movement to the next column
  - no constant conveyor-belt motion
  4 windows × 5 seconds, ~0.42 s transition each.
*/
@keyframes niriSnap{
   0%, 21.5% { transform:translateX(0); }
  23.5%, 46.5% { transform:translateX(-860px); }
  48.5%, 71.5% { transform:translateX(-1720px); }
  73.5%, 96.5% { transform:translateX(-2580px); }
  98.5%,100% { transform:translateX(-3440px); }
}
@keyframes statusPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes mer1{0%,100%{transform:scaleX(.34)}50%{transform:scaleX(.92)}}
@keyframes mer2{0%,100%{transform:scaleX(.85)}50%{transform:scaleX(.28)}}
@media(prefers-reduced-motion:reduce){
  .track,.float,.m1,.m2,.status,.cursor{animation:none!important}
}
</style>

<defs>
  <clipPath id="viewport"><rect width="960" height="620" rx="18"/></clipPath>
</defs>

<rect class="desktop" width="960" height="620" rx="18"/>
<text x="24" y="600" class="text muted small hint">i &lt;3 niri</text>
<text x="787" y="600" class="text muted small hint">Mod+Right  →</text>

<g clip-path="url(#viewport)">
<g class="track">


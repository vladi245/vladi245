      <tspan x="0" y="160" class="n2">/         /          \</tspan><tspan class="n1">/        \</tspan>
      <tspan x="0" y="180" class="n2">\____    /</tspan><tspan class="n1">\          /   ______/</tspan>
      <tspan x="0" y="200" class="n2">    /   /</tspan><tspan class="n1">  \        /   /</tspan>
      <tspan x="0" y="220" class="n2">   /   /</tspan><tspan class="n1">\   \</tspan><tspan class="n2">______</tspan><tspan class="n1">/</tspan><tspan class="n2">___</tspan><tspan class="n1">/</tspan><tspan class="n2">_____</tspan>
